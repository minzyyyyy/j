<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리가 할 수 있는 현실 직업 10선</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Malgun Gothic', sans-serif;
        }
        body {
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card-container {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
        }
        .page-indicator {
            font-size: 14px;
            color: #2980b9;
            font-weight: bold;
            margin-bottom: 10px;
            background: #eaf2f8;
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
        }
        /* 직업 이름 강조 */
        h1 {
            color: #2c3e50;
            font-size: 30px;
            margin: 10px 0 20px 0;
            font-weight: 800;
        }
        .job-image-box {
            width: 100%;
            height: 250px;
            background-color: #e9ecef;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .job-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .job-description {
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            background-color: #f8f9fa;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 6px solid #27ae60;
            text-align: left;
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
        button {
            flex: 1;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-prev {
            background-color: #95a5a6;
            color: white;
        }
        .btn-prev:hover {
            background-color: #7f8c8d;
        }
        .btn-next {
            background-color: #3498db;
            color: white;
        }
        .btn-next:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #e0e0e0;
            color: #a0a0a0;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="page-indicator" id="page-indicator">1 / 10 단계</div>
    <!-- 직업 이름이 큼직하게 표시되는 곳 -->
    <h1 id="job-title">도서관 사서보조</h1>
    
    <!-- 실제 사람 사진 영역 -->
    <div class="job-image-box">
        <img id="job-photo" src="" alt="직업 사진">
    </div>

    <!-- 핵심 설명 영역 -->
    <div class="job-description" id="job-desc">
        도서관에서 사람들이 반납한 책들을 번호 순서대로 책장에 바르게 꽂아두는 일을 해요.
    </div>

    <div class="btn-group">
        <button class="btn-prev" id="prev-btn" onclick="changePage(-1)" disabled>이전으로</button>
        <button class="btn-next" id="next-btn" onclick="changePage(1)">다음 직업 ➡️</button>
    </div>
</div>

<script>
    // 총 10가지의 현실 직업 데이터 리스트
    const jobs = [
        {
            title: "도서관 사서보조",
            photo: "https://images.unsplash.com/photo-1521587760476-6c12a4b040da?auto=format&fit=crop&w=800&q=80",
            desc: "도서관에서 사람들이 반납한 책들을 번호 순서대로 책장에 바르게 꽂아두는 일을 해요."
        },
        {
            title: "건물 청소원",
            photo: "https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=800&q=80",
            desc: "건물의 복도나 교실을 깨끗하게 쓸고 닦으며, 쓰레기통을 비우고 분리수거를 해요."
        },
        {
            title: "마트 상품진열원",
            photo: "https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&w=800&q=80",
            desc: "마트 진열대에 비어 있는 물건을 채워 넣고, 가격표가 바르게 붙어 있는지 확인해요."
        },
        {
            title: "식기세척원",
            photo: "https://images.unsplash.com/photo-1554118811-1e0d58224f24?auto=format&fit=crop&w=800&q=80",
            desc: "카페나 식당에서 손님들이 사용한 컵과 그릇을 깨끗이 씻고 주변을 정돈해요."
        },
        {
            title: "사무보조원",
            photo: "https://images.unsplash.com/photo-1497215728101-856f4ea42174?auto=format&fit=crop&w=800&q=80",
            desc: "사무실에서 서류를 분류하고, 우편물을 정리하거나 도장을 찍는 업무를 도와요."
        },
        {
            title: "택배 분류원",
            photo: "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=800&q=80",
            desc: "택배 상자에 적힌 주소와 지역을 보고 알맞은 구역별로 상자를 분류하고 정리해요."
        },
        {
            title: "농업·원예 보조원",
            photo: "https://images.unsplash.com/photo-1592417817098-8f3d691a4bf5?auto=format&fit=crop&w=800&q=80",
            desc: "농장에서 씨앗을 심고, 식물에 물을 주며 자라난 작물을 수확하고 다듬는 일을 해요."
        },
        {
            title: "제과제빵 보조원",
            photo: "https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=800&q=80",
            desc: "빵집이나 공장에서 구워진 빵을 예쁘게 포장하고 상자에 담는 일을 도와요."
        },
        {
            title: "세탁물 분류원",
            photo: "https://images.unsplash.com/photo-1517677208171-0bc6725a3e60?auto=format&fit=crop&w=800&q=80",
            desc: "세탁된 옷이나 수건을 색깔별, 종류별로 가지런히 분류하고 개켜서 정리해요."
        },
        {
            title: "매장 카트 정리원",
            photo: "https://images.unsplash.com/photo-1534452203293-494d7ddbf7e0?auto=format&fit=crop&w=800&q=80",
            desc: "대형 마트 주차장이나 입구에 흩어져 있는 쇼핑 카트를 모아서 제자리에 정돈해요."
        }
    ];

    let currentIndex = 0;

    function updateCard() {
        const currentJob = jobs[currentIndex];
        
        document.getElementById('page-indicator').innerText = `${currentIndex + 1} / ${jobs.length} 단계`;
        document.getElementById('job-title').innerText = currentJob.title;
        document.getElementById('job-photo').src = currentJob.photo;
        document.getElementById('job-desc').innerText = currentJob.desc;

        // 버튼 활성화/비활성화 제어
        document.getElementById('prev-btn').disabled = currentIndex === 0;
        
        const nextBtn = document.getElementById('next-btn');
        if (currentIndex === jobs.length - 1) {
            nextBtn.innerText = "처음으로 🔄";
        } else {
            nextBtn.innerText = "다음 직업 ➡️";
        }
    }

    // 초기 실행
    updateCard();

    function changePage(direction) {
        currentIndex += direction;
        
        if (currentIndex >= jobs.length) {
            currentIndex = 0;
        }
        
        updateCard();
    }
</script>

</body>
</html>
